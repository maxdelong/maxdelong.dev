version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint requires TypeScript below 6.1
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep the Node types in step with the Node 24 engine pin
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
